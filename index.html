<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redesigned 2BHK - Open Plan (No Congestion)</title>
    <style>
      body {
        background-color: #3b4252;
        display: flex;
        justify-content: center;
        padding: 40px;
        font-family: 'Segoe UI', Arial, sans-serif;
      }
      .blueprint-sheet {
        background-color: #eceff4;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        padding: 40px;
        border: 2px solid #2e3440;
      }
      .title-block {
        border: 2px solid #2e3440;
        background: #fff;
        padding: 15px;
        margin-top: 20px;
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        font-weight: bold;
        color: #2e3440;
      }
      svg {
        border: 3px solid #2e3440;
        background-color: #ffffff;
      }
      .wall-ext {
        fill: #2e3440;
      }
      .wall-int {
        fill: #4c566a;
      }
      .room-open {
        fill: #e5e9f0;
      } /* Light color for massive open area */
      .room-bed {
        fill: #d8dee9;
      }
      .room-bath {
        fill: #d0e6ec;
      }
      .text-main {
        font-size: 15px;
        font-weight: bold;
        fill: #2e3440;
        text-anchor: middle;
      }
      .text-highlight {
        font-size: 14px;
        font-weight: bold;
        fill: #bf616a;
        text-anchor: middle;
      }
      .text-sub {
        font-size: 12px;
        fill: #4c566a;
        text-anchor: middle;
      }
      .text-dim {
        font-size: 10px;
        font-weight: bold;
        fill: #bf616a;
        text-anchor: middle;
      }
      .window {
        fill: #88c0d0;
        stroke: #5e81ac;
        stroke-width: 2.5;
      }
      .door-open {
        fill: #ffffff;
      }
      .stair-line {
        stroke: #2e3440;
        stroke-width: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="blueprint-sheet">
      <svg
        width="650"
        height="1020"
        viewBox="-20 -20 650 1020"
        xmlns="http://www.w3.org/2000/svg"
      >
        <!-- Plot Boundary -->
        <rect
          x="0"
          y="0"
          width="610"
          height="975"
          fill="none"
          stroke="#81a1c1"
          stroke-width="2"
          stroke-dasharray="10,5"
        />
        <text x="305" y="-5" class="text-sub" fill="#81a1c1">
          PLOT BOUNDARY (7.62m x 12.192m)
        </text>

        <!-- Building Footprint Group -->
        <g transform="translate(36, 36)">
          <!-- REAR BEDROOM 1 (Master) -->
          <rect x="18" y="18" width="264" height="240" class="room-bed" />
          <text x="150" y="125" class="text-main">MASTER BEDROOM</text>
          <text x="150" y="145" class="text-sub">3.30m x 3.00m</text>

          <!-- REAR BEDROOM 2 -->
          <rect x="291" y="18" width="228" height="240" class="room-bed" />
          <text x="405" y="125" class="text-main">BEDROOM 2</text>
          <text x="405" y="145" class="text-sub">2.85m x 3.00m</text>

          <!-- MASSIVE OPEN PLAN: LIVING + KITCHEN (No dividing wall) -->
          <rect x="18" y="267" width="264" height="480" class="room-open" />

          <!-- Kitchen Zone (Top Half of open space) -->
          <text x="150" y="340" class="text-main">OPEN KITCHEN</text>
          <text x="150" y="360" class="text-sub">3.30m x 2.20m</text>
          <!-- L-Shaped Kitchen Counter -->
          <rect
            x="18"
            y="267"
            width="60"
            height="150"
            fill="#cbd5e1"
            stroke="#94a3b8"
          />
          <rect
            x="18"
            y="267"
            width="180"
            height="60"
            fill="#cbd5e1"
            stroke="#94a3b8"
          />

          <!-- Living Zone (Bottom Half of open space) -->
          <text x="150" y="520" class="text-main">SPACIOUS LIVING ROOM</text>
          <text x="150" y="540" class="text-highlight">
            NO HALLWAY CONGESTION
          </text>
          <text x="150" y="560" class="text-sub">3.30m x 3.75m</text>

          <!-- ATTACHED BATH (For Bedroom 2) -->
          <rect x="291" y="267" width="110" height="176" class="room-bath" />
          <text x="346" y="345" class="text-main">ATTACHED</text>
          <text x="346" y="360" class="text-sub">BATH</text>

          <!-- COMMON BATH -->
          <rect x="410" y="267" width="109" height="176" class="room-bath" />
          <text x="464" y="345" class="text-main">COMMON</text>
          <text x="464" y="360" class="text-sub">BATH</text>

          <!-- ENTRANCE FOYER -->
          <rect x="291" y="452" width="228" height="131" class="room-open" />
          <text x="405" y="515" class="text-main">ENTRANCE FOYER</text>

          <!-- STAIRCASE (Kept in original structural location) -->
          <rect
            x="291"
            y="592"
            width="228"
            height="155"
            fill="#cfd8dc"
            stroke="#2e3440"
          />
          <line x1="291" y1="607" x2="519" y2="607" class="stair-line" />
          <line x1="291" y1="622" x2="519" y2="622" class="stair-line" />
          <line x1="291" y1="637" x2="519" y2="637" class="stair-line" />
          <line x1="291" y1="652" x2="519" y2="652" class="stair-line" />
          <line x1="291" y1="667" x2="519" y2="667" class="stair-line" />
          <line x1="291" y1="682" x2="519" y2="682" class="stair-line" />
          <line x1="291" y1="697" x2="519" y2="697" class="stair-line" />
          <line x1="291" y1="712" x2="519" y2="712" class="stair-line" />
          <line x1="291" y1="727" x2="519" y2="727" class="stair-line" />
          <text x="405" y="675" class="text-main" fill="#2e3440">UP</text>

          <!-- EXTERIOR WALLS (230mm) -->
          <rect x="0" y="0" width="537" height="18" class="wall-ext" />
          <!-- Top -->
          <rect x="0" y="747" width="271" height="18" class="wall-ext" />
          <!-- Bottom Left -->
          <rect x="271" y="747" width="266" height="18" class="wall-ext" />
          <!-- Bottom Right Stair Wall -->
          <rect x="0" y="0" width="18" height="765" class="wall-ext" />
          <!-- Left -->
          <rect x="519" y="0" width="18" height="765" class="wall-ext" />
          <!-- Right -->

          <!-- INTERIOR WALLS (115mm) -->
          <!-- Central Vertical Wall (between beds and baths) -->
          <rect x="282" y="18" width="9" height="425" class="wall-int" />
          <!-- Horizontal Wall (between Beds and Kitchen/Baths) -->
          <rect x="18" y="258" width="501" height="9" class="wall-int" />
          <!-- Horizontal Wall (between Baths and Foyer) -->
          <rect x="282" y="443" width="237" height="9" class="wall-int" />
          <!-- Vertical Wall (between the two baths) -->
          <rect x="401" y="267" width="9" height="176" class="wall-int" />
          <!-- Horizontal Wall (between Foyer and Stairs) -->
          <rect x="291" y="583" width="228" height="9" class="wall-int" />

          <!-- WINDOWS -->
          <rect x="0" y="100" width="18" height="80" class="window" />
          <!-- Master Bed -->
          <rect x="0" y="550" width="18" height="100" class="window" />
          <!-- Living Room -->
          <rect x="60" y="747" width="120" height="18" class="window" />
          <!-- Living Room Front -->
          <rect x="519" y="100" width="18" height="80" class="window" />
          <!-- Bed 2 -->
          <rect x="519" y="335" width="18" height="40" class="window" />
          <!-- Common Bath Vent -->

          <!-- DOORS (Openings carved into walls) -->
          <!-- Master Bed Door -->
          <rect x="210" y="258" width="72" height="9" class="door-open" />
          <text x="246" y="253" class="text-dim">D</text>
          <!-- Bed 2 Door -->
          <rect x="295" y="258" width="72" height="9" class="door-open" />
          <text x="331" y="253" class="text-dim">D</text>
          <!-- Attached Bath Door -->
          <rect x="282" y="320" width="9" height="60" class="door-open" />
          <text x="270" y="355" class="text-dim">D2</text>
          <!-- Common Bath Door -->
          <rect x="420" y="443" width="60" height="9" class="door-open" />
          <text x="450" y="438" class="text-dim">D2</text>
          <!-- Main Entrance Door (Double Door) -->
          <rect x="210" y="747" width="96" height="18" class="door-open" />
          <text x="258" y="742" class="text-dim">MAIN DOOR</text>

          <!-- PARKING / PORCH -->
          <text x="140" y="860" class="text-main" fill="#81a1c1">
            FRONT PARKING & PORCH
          </text>
          <line
            x1="0"
            y1="765"
            x2="0"
            y2="920"
            stroke="#81a1c1"
            stroke-dasharray="5"
          />
          <line
            x1="0"
            y1="920"
            x2="271"
            y2="920"
            stroke="#2e3440"
            stroke-width="4"
          />
          <text x="135" y="940" class="text-main">MAIN GATE</text>
        </g>
      </svg>

      <div class="title-block">
        <div><strong>PROJECT:</strong> OPEN PLAN REDESIGN</div>
        <div><strong>TYPE:</strong> ZERO-CONGESTION 2BHK</div>
        <div><strong>DIMENSIONS:</strong> 6.72m x 9.577m</div>
        <div><strong>STYLE:</strong> MODERN OPEN CONCEPT</div>
      </div>
    </div>
  </body>
</html>
